name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests connect to an in-memory MongoDB (mongodb-memory-server); these
      # only need to satisfy config validation, not point at a real DB.
      MONGOURI: mongodb://127.0.0.1:27017/ci-placeholder
      JWT_SECRET: ci-only-placeholder-secret-not-used-in-prod
      JWT_EXPIRE: 5d
      COOKIE_EXPIRE: 5
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  migrations:
    name: Migrations (apply to a throwaway Mongo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGOURI: mongodb://127.0.0.1:27017/ci-migrations
      JWT_SECRET: ci-only-placeholder-secret-not-used-in-prod
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations
        run: npm run migrate:up
      - name: Re-apply migrations (must be a no-op — proves idempotency)
        run: npm run migrate:up
